<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hyperliquid Recovery Bot User Guide</title>
    <link rel="stylesheet" href="gitbook/style.css">
    <style>
      .language-select {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .language-select__inner {
        width: 100%;
        max-width: 560px;
      }
      .language-select h1 {
        margin-top: 0;
      }
      .language-select__links {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 24px;
      }
      .language-select__links a {
        display: block;
        padding: 16px;
        border: 1px solid #e6e6e6;
        border-radius: 4px;
        text-align: center;
        font-weight: 600;
      }
      @media (max-width: 600px) {
        .language-select__links {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="language-select markdown-section">
      <div class="language-select__inner">
        <h1>Hyperliquid Recovery Bot User Guide</h1>
        <p>Please choose a language to continue.</p>
        <div class="language-select__links">
          <a href="en/">English</a>
          <a href="zh/">中文</a>
        </div>
      </div>
    </main>
  </body>
</html>
